<!doctype html>
<html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6efd9"><title>Listen & Choose · Human or Robot?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--ink:#243a3c;--muted:#6b7771;--paper:#f6efd9;--green:#bfe0d0;--gold:#ffcc72;--salmon:#f6b39e;--border:#2b4746;--shadow:0 6px 0 #28413e;--soft:0 14px 38px #17373118;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);background-image:radial-gradient(#a9a48b50 .9px,transparent .9px);background-size:24px 24px}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #e57950;outline-offset:4px}.app{width:min(1150px,calc(100% - 34px));margin:auto;padding-bottom:35px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:26px 0 18px;border-bottom:2px solid #40504830}.logo{display:flex;align-items:center;gap:13px}.symbol{height:49px;width:49px;border:2px solid var(--ink);border-radius:16px;background:var(--salmon);display:grid;place-items:center;font:700 31px 'Space Grotesk';transform:rotate(-7deg)}.brand{font:700 clamp(21px,3vw,29px) 'Space Grotesk';letter-spacing:-1.5px}.tag{font-weight:800;color:#718075;letter-spacing:2.2px;text-transform:uppercase;font-size:10px}.plain{background:none;border:1.6px solid var(--ink);border-radius:50px;padding:10px 17px;font-size:13px;font-weight:800;color:var(--ink)}.topright{display:flex;gap:12px;align-items:center}.progressblock{padding:28px 0 19px;display:flex;align-items:center;justify-content:space-between;gap:15px}.eyebrow{color:#9a7350;text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:800}.headline{font:700 clamp(31px,5vw,60px)/1.05 'Space Grotesk';letter-spacing:-3px;margin:9px 0}.intro{font-size:15px;line-height:1.5;color:#53635e;margin:0}.number{font:700 60px 'Space Grotesk';letter-spacing:-4px;text-align:right}.number small{font:700 17px 'DM Sans';color:#84918a;letter-spacing:0}.progress{width:100%;height:13px;background:#e3dbc4;border:1.5px solid #485b5355;border-radius:50px;overflow:hidden}.progress>div{height:100%;width:0;background:#66b89d;transition:width .28s}.stagebar{display:flex;gap:6px;padding:20px 0}.stagepill{border:2px solid #9ba59b75;background:#f4efdd;border-radius:50px;padding:9px 14px;font-size:12px;font-weight:800;color:#6f8277}.stagepill.current{border-color:#213f3f;background:#284f48;color:#fff}.stagepill.done{background:#c4e6cd;border-color:#8aaf98;color:#254a37}.stage{position:relative;overflow:hidden;border:2px solid var(--border);border-radius:25px;background:#fcf8ea;box-shadow:var(--shadow);min-height:535px;padding:31px 34px 30px}.stage:before{content:'';position:absolute;top:-110px;right:-105px;border:2px solid #68827d20;width:380px;height:380px;border-radius:50%;pointer-events:none}.stage:after{content:'';position:absolute;top:-40px;right:-20px;border:2px solid #68827d1b;width:250px;height:250px;border-radius:50%;pointer-events:none}.questionrow{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}.instruction{font-size:12px;text-transform:uppercase;letter-spacing:1.8px;font-weight:800;color:#997d57}.micro{font-size:12px;color:#728079;font-weight:700}.listenarea{display:grid;justify-items:center;gap:13px;text-align:center;padding:18px 0 24px;position:relative;z-index:1}.sound{height:141px;width:141px;background:#f8c76e;color:#28473f;border:3px solid var(--ink);border-radius:50%;box-shadow:0 10px 0 #c8974f;display:grid;place-items:center;transition:transform .15s,box-shadow .15s}.sound:hover{transform:translateY(-4px);box-shadow:0 14px 0 #c8974f}.sound:active{transform:translateY(5px);box-shadow:0 4px 0 #c8974f}.sound.speaking{animation:pulse 1s ease-in-out infinite alternate}@keyframes pulse{from{box-shadow:0 10px 0 #c8974f,0 0 0 0 #f9d994}to{box-shadow:0 10px 0 #c8974f,0 0 0 15px #f9d99450}}.sound svg{width:61px;height:61px}.soundtext{font:700 20px 'Space Grotesk';letter-spacing:-.5px}.soundnote{font-size:12px;color:#6c756e}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:890px;margin:2px auto 18px;position:relative;z-index:1}.word{min-height:100px;display:flex;align-items:center;justify-content:center;padding:18px 10px;text-align:center;border:2px solid #344e46;border-radius:15px;background:#e1eeda;color:#28443e;box-shadow:0 5px 0 #95b6a7;font:700 clamp(17px,2.5vw,26px)/1.18 'Space Grotesk';letter-spacing:-.6px;transition:transform .13s,background .13s,box-shadow .13s}.word:nth-child(3n+2){background:#f9dec6;box-shadow:0 5px 0 #e5bda2}.word:nth-child(3n){background:#dbeafa;box-shadow:0 5px 0 #aac5d9}.word:hover{transform:translateY(-3px)}.word:active{transform:translateY(2px);box-shadow:0 2px 0 #6c8279}.pictures{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;max-width:985px;margin:12px auto 20px;position:relative;z-index:1}.picture{background:#fff;border:3px solid #314b46;border-radius:19px;overflow:hidden;padding:0;box-shadow:0 7px 0 #85918a;transition:transform .15s,box-shadow .15s}.picture:hover{transform:translateY(-5px);box-shadow:0 12px 0 #85918a}.picture img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.picture span{display:block;padding:13px;font:700 clamp(18px,3vw,28px) 'Space Grotesk';background:#fffaf0}.picture:nth-child(2) span{background:#e9f3d8}.picture:nth-child(3) span{background:#e9effa}.bottom{border-top:2px dashed #9a9d8b78;padding-top:20px;display:flex;justify-content:space-between;align-items:center;gap:15px;position:relative;z-index:1}.bottom p{margin:0;font-size:13px;color:#758179}.roundlabel{font-weight:800;color:#53655e;font-size:13px}.bigbutton{border:2px solid var(--ink);background:var(--ink);color:white;border-radius:13px;padding:15px 25px;font-weight:800;font-size:15px;box-shadow:0 5px 0 #142823}.bigbutton.secondary{background:#f3d292;color:var(--ink);box-shadow:0 5px 0 #bba778}.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:460px;position:relative;z-index:1}.center h2{font:700 clamp(36px,6vw,70px)/1.04 'Space Grotesk';letter-spacing:-3px;margin:13px 0}.center p{max-width:530px;line-height:1.65;color:#56685f;margin:7px 0 27px}.bigicon{font-size:65px}.notice{font-size:13px;color:#698078;margin-top:28px}.errorcount{font:700 90px 'Space Grotesk';line-height:1;color:#d87b5c}.errorlabel{text-transform:uppercase;letter-spacing:2px;font-size:14px;font-weight:800;color:#a7735e}.footer{display:flex;justify-content:space-between;gap:20px;padding:19px 3px;color:#8b9183;font-size:12px}.hidden{display:none!important}@media(max-width:690px){.app{width:calc(100% - 18px)}.top{padding:15px 2px}.brand{font-size:21px}.symbol{width:39px;height:39px;font-size:25px}.stage{padding:21px 15px;min-height:555px}.progressblock{padding-top:20px}.headline{letter-spacing:-1.5px}.number{font-size:38px}.number small{font-size:12px}.stagebar{overflow:auto}.stagepill{white-space:nowrap;padding:8px 10px}.sound{width:118px;height:118px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.word{min-height:93px;font-size:19px}.pictures{gap:8px}.picture{border-width:2px;border-radius:11px;box-shadow:0 4px 0 #85918a}.picture span{font-size:14px;padding:8px 2px}.bottom{align-items:flex-start}.center h2{letter-spacing:-1.5px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body>
<div class="app"><header class="top"><div class="logo"><div class="symbol">↗</div><div><div class="brand">Listen & Choose<span style="color:#d99067">.</span></div><div class="tag">Human or Robot? · English starters</div></div></div><div class="topright"><button class="plain" id="restart">↻ Restart</button></div></header>
<section class="progressblock"><div><div class="eyebrow" id="eyebrow">English listening game</div><h1 class="headline" id="title">Ready to listen?</h1><p class="intro" id="subtitle">Höre genau hin und wähle die passende Karte.</p></div><div class="number" id="counter">0<small> / 47</small></div></section><div class="progress"><div id="progress"></div></div><nav class="stagebar" aria-label="Drei Lernrunden"><span class="stagepill" id="pill0">01 · English</span><span class="stagepill" id="pill1">02 · Deutsch</span><span class="stagepill" id="pill2">03 · Pictures</span></nav>
<main class="stage" id="stage" aria-live="off"></main><footer class="footer"><span>ENGLISH · LISTEN FIRST</span><span id="lv">LearningView ready</span></footer></div>
<script>
'use strict';
const GROUPS=[
[['skin','Haut'],['hair','Haare'],['blood','Blut'],['heart','Herz'],['brain','Gehirn'],['feelings','Gefühle'],['food','Essen'],['water','Wasser'],['eat','essen'],['drink','trinken'],['sleep','schlafen'],['grow','wachsen'],['cry','weinen'],['dream','träumen'],['feel pain','Schmerzen spüren']],
[['head','Kopf'],['arms','Arme'],['hands','Hände'],['legs','Beine'],['feet','Füsse'],['eyes','Augen'],['voice','Stimme'],['body','Körper'],['walk','gehen'],['run','rennen'],['jump','springen'],['dance','tanzen'],['talk','sprechen'],['listen','zuhören'],['see','sehen'],['carry','tragen']],
[['battery','Akku'],['motor','Motor'],['wires','Kabel'],['computer','Computer'],['camera','Kamera'],['sensor','Sensor'],['metal','Metall'],['software','Software'],['charge','aufladen'],['scan','scannen'],['calculate','berechnen'],['record','aufnehmen'],['restart','neu starten'],['update','aktualisieren'],['switch on','einschalten'],['switch off','ausschalten']]
];
const WORDS=GROUPS.flatMap((group,g)=>group.map(([en,de],i)=>({id:g+'-'+i,en,de,g})));
const $=s=>document.querySelector(s);
const shuffle=a=>{const arr=[...a];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr};
let stage=0, index=0, order=[], answers=[], retryCount=0, screen='welcome', muted=false, speakDelay=0, pickedVoice=null, lvMode=window.learningView?.mode||'student', lvReady=false, loaded=false, awaitingSave=false, queuedSave=null;
const LABELS=['English word','German translation','Human, robot or both?'];
function setHTML(markup){$('#stage').innerHTML=markup}
function updateHeader(){const roundTotal=order.length||47;const titles=['Listen for the word.','Find the translation.','Who does it belong to?'];$('#eyebrow').textContent=screen==='welcome'?'3 rounds · 47 words each':stage<3?'Round '+(stage+1)+' of 3':'All rounds finished';$('#title').textContent=screen==='welcome'?'Ready to listen?':screen==='done'?'Fantastic work!':titles[Math.min(stage,2)];$('#subtitle').textContent=screen==='welcome'?'Höre 47 englische Wörter in drei verschiedenen Übungen.':'Klicke auf den Lautsprecher und höre das englische Wort so oft du möchtest.';$('#counter').innerHTML=(screen==='welcome'||screen==='done'?'':Math.min(index+1,roundTotal))+'<small> / '+roundTotal+'</small>';$('#progress').style.width=(screen==='done'?100:(screen==='welcome'?0:index/roundTotal*100))+'%';for(let i=0;i<3;i++){$('#pill'+i).className='stagepill'+(stage===i&&screen!=='done'&&screen!=='welcome'?' current':'')+(i<stage||screen==='done'?' done':'')}}
function voice(){const a=window.speechSynthesis?.getVoices()||[];return a.find(v=>v.lang==='en-GB'&&/Google|Microsoft|Samantha|Daniel|Serena/i.test(v.name))||a.find(v=>v.lang==='en-GB')||a.find(v=>v.lang.startsWith('en')&&/Google|Microsoft|Samantha/i.test(v.name))||a.find(v=>v.lang.startsWith('en'))||null}
function stopSpeech(){clearTimeout(speakDelay);if('speechSynthesis' in window)window.speechSynthesis.cancel()}
function speak(){if(!('speechSynthesis' in window)){const p=$('#speechSupport');if(p)p.textContent='Dein Browser unterstützt keine Sprachausgabe. Verwende Chrome, Edge oder Safari.';return}stopSpeech();const w=order[index];if(!w)return;const utter=new SpeechSynthesisUtterance(w.en);utter.lang='en-GB';utter.rate=.76;utter.pitch=1;utter.volume=1;utter.voice=voice();const btn=$('#sound');utter.onstart=()=>btn?.classList.add('speaking');utter.onend=()=>btn?.classList.remove('speaking');utter.onerror=()=>btn?.classList.remove('speaking');window.speechSynthesis.speak(utter)}
function scheduleSpeech(){stopSpeech();speakDelay=setTimeout(()=>{if(screen==='question')speak()},380)}
function save(){if(!lvReady||lvMode!=='student')return;const data=JSON.stringify({v:1,stage,done:screen==='done'});if(awaitingSave){queuedSave=data;return}awaitingSave=true;post({type:'saveAnswerData',data});$('#lv').textContent='Saving in LearningView …'}
function post(payload){if(window.parent!==window)window.parent.postMessage(payload,'https://learningview.org')}
function reportSuccess(){if(lvMode==='student')post({result:{score:{scaled:1}}})}
window.addEventListener('message',e=>{if(e.source!==window.parent||e.origin!=='https://learningview.org')return;const d=e.data;if(d==='SAVED'){awaitingSave=false;$('#lv').textContent='LearningView · saved';if(queuedSave){const v=queuedSave;queuedSave=null;awaitingSave=true;post({type:'saveAnswerData',data:v})}return}if(d?.type==='sendEmbedContext'){lvReady=true;lvMode=d.mode||lvMode;if(lvMode==='student'){post({type:'getAnswerData'});$('#lv').textContent='LearningView connected'}else{$('#lv').textContent=lvMode==='studentReview'?'LearningView · review':'LearningView · preview'}return}if(d?.type==='sendAnswerData'&&!loaded){loaded=true;if(d.data){try{const saved=JSON.parse(d.data);if(saved.v===1){stage=Math.max(0,Math.min(3,Number(saved.stage)||0));if(saved.done){screen='done';stage=3;renderDone();return}}}catch{}}renderWelcome();return}});
function startRound(retryWords=null){stopSpeech();screen='question';index=0;answers=[];if(retryWords){const ids=new Set(retryWords.map(w=>w.id));const extras=shuffle(WORDS.filter(w=>!ids.has(w.id))).slice(0,Math.max(0,Math.ceil(WORDS.length/3)-retryWords.length));order=shuffle([...retryWords,...extras]);retryCount++}else{order=shuffle(WORDS);retryCount=0}save();renderQuestion()}
function choiceSet(current){const pool=shuffle(WORDS.filter(w=>w.id!==current.id));return shuffle([current,...pool.slice(0,5)])}
function speakerMarkup(){return `<div class="listenarea"><button class="sound" id="sound" aria-label="Englisches Wort erneut anhören" title="Wort erneut hören"><svg viewBox="0 0 64 64" fill="none"><path d="M11 25h10l17-14v42L21 39H11z" fill="currentColor"/><path d="M46 21c7 7 7 15 0 22M51 13c12 12 12 26 0 38" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg></button><div class="soundtext">Tap to listen again</div><div class="soundnote" id="speechSupport">Langsam und deutlich · So oft du möchtest</div></div>`}
function renderQuestion(){screen='question';updateHeader();const w=order[index];const opts=choiceSet(w);const instruction=stage===0?'Höre das Wort und wähle die englische Karte.':stage===1?'Höre das Wort und wähle die deutsche Übersetzung.':'Höre das Wort und wähle das passende Bild.';let answersMarkup='';if(stage<2){answersMarkup=`<div class="cards">${opts.map(x=>`<button class="word" data-id="${x.id}">${escapeText(stage===0?x.en:x.de)}</button>`).join('')}</div>`}else{const pics=[['human','Humans'],['both','Both'],['robot','Robots']];answersMarkup=`<div class="pictures">${pics.map(([key,title])=>`<button class="picture" data-g="${key==='human'?0:key==='robot'?2:1}" aria-label="${title}"><img src="${key}.jpg" alt="${title}" draggable="false"><span>${title}</span></button>`).join('')}</div>`}
setHTML(`<div class="questionrow"><span class="instruction">${instruction}</span><span class="micro">${index+1} / ${order.length}</span></div>${speakerMarkup()}${answersMarkup}<div class="bottom"><span class="roundlabel">${LABELS[stage]}</span><p>Keine Lösung wird angezeigt.</p></div>`);$('#sound').addEventListener('click',speak);for(const b of $('#stage').querySelectorAll('[data-id],[data-g]'))b.addEventListener('click',()=>choose(stage===2?Number(b.dataset.g):b.dataset.id));scheduleSpeech()}
function escapeText(v){return v.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function choose(answer){if(screen!=='question')return;stopSpeech();const w=order[index];answers.push(stage===2?answer===w.g:answer===w.id);index++;if(index===order.length)renderCheck();else renderQuestion()}
function renderCheck(){screen='check';stopSpeech();updateHeader();setHTML(`<div class="center"><div class="bigicon">✎</div><h2>Round complete!</h2><p>Alle ${order.length} Antworten sind gespeichert. Prüfe jetzt dein Ergebnis. Es wird nur die Anzahl Fehler angezeigt.</p><button id="check" class="bigbutton">Check answers →</button></div>`);$('#check').addEventListener('click',renderResult)}
function renderResult(){screen='result';updateHeader();const missed=order.filter((w,i)=>!answers[i]);const n=missed.length;if(n){const nextSize=Math.max(Math.ceil(WORDS.length/3),n);setHTML(`<div class="center"><div class="errorcount">${n}</div><div class="errorlabel">${n===1?'Fehler':'Fehler'} in dieser Runde</div><h2>Try again!</h2><p>Du hörst nun ${nextSize} Wörter: alle falsch beantworteten Begriffe und bei Bedarf zufällige Wiederholungen. Welche Antworten falsch waren, bleibt geheim.</p><button id="again" class="bigbutton secondary">↻ Repeat ${nextSize} words</button></div>`);$('#again').addEventListener('click',()=>startRound(missed))}else{setHTML(`<div class="center"><div class="bigicon">★</div><h2>${order.length} out of ${order.length}!</h2><p>Alle Wörter dieser Runde richtig gehört und zugeordnet. ${stage===2?'Du hast alle drei Übungen geschafft!':'Bereit für die nächste Hörrunde?'}</p><button id="next" class="bigbutton">${stage===2?'Finish ✓':'Next round →'}</button></div>`);$('#next').addEventListener('click',()=>{stage++;if(stage===3){screen='done';save();reportSuccess();renderDone()}else startRound()})}}
function renderWelcome(){if(stage===3){screen='done';renderDone();return}screen='welcome';stopSpeech();updateHeader();const subtitle=['Listen and choose the English word.','Listen and choose the German meaning.','Listen and choose the right picture.'];const desc=['Du hörst ein englisches Wort und wählst aus sechs englischen Wortkarten.','Du hörst ein englisches Wort und wählst die passende deutsche Übersetzung.','Du hörst ein englisches Wort, ohne es zu sehen. Wähle HUMANS, ROBOTS oder BOTH.'];setHTML(`<div class="center"><div class="bigicon">♫</div><div class="eyebrow">ROUND ${stage+1} / 3</div><h2>${subtitle[stage]}</h2><p>${desc[stage]} Du kannst jedes englische Wort beliebig oft erneut anhören.</p><button id="start" class="bigbutton">Start listening →</button><div class="notice">47 Begriffe · zufällig gemischt · keine Lösungshinweise</div></div>`);$('#start').addEventListener('click',()=>startRound())}
function renderDone(){screen='done';stage=3;stopSpeech();updateHeader();setHTML(`<div class="center"><div class="bigicon">🏆</div><div class="eyebrow">ALL 3 ROUNDS FINISHED</div><h2>Well done!</h2><p>Du hast alle drei Hörübungen erfolgreich abgeschlossen und die schwierigen Wörter wiederholt.</p><button id="restartGame" class="bigbutton secondary">↻ Play again</button><div class="notice">100 % · Ergebnis an LearningView gemeldet, sofern dort eingebettet.</div></div>`);$('#restartGame').addEventListener('click',()=>{stage=0;renderWelcome();save()})}
$('#restart').addEventListener('click',()=>{if(!confirm('Spiel wirklich von vorne beginnen?'))return;stage=0;renderWelcome();save()});
if(window.parent!==window)post({type:'getEmbedContext'});renderWelcome();
</script></body></html>
